<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="robots" content="noindex">
  <title>ひがやいびん</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="ひがやいびん">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <h1>ひがやいびん</h1>
      <ul class="summary" id="summary" aria-live="polite"></ul>
      <button type="button" class="btn small logout" id="logout" hidden>ログアウト</button>
    </div>
  </header>

  <section class="login panel" id="login" hidden aria-labelledby="login-title">
    <h2 id="login-title">ログイン</h2>
    <form id="login-form" class="item-form">
      <label class="field">
        <span>メールアドレス</span>
        <input name="email" type="email" required autocomplete="username">
      </label>
      <label class="field">
        <span>パスワード</span>
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <p class="error" id="login-error" role="alert" hidden></p>
      <button type="submit" class="btn primary">ログインする</button>
    </form>
  </section>

  <main class="layout" id="main" hidden>
    <section class="panel report" id="report" hidden aria-labelledby="report-title">
      <h2 id="report-title"></h2>
      <ul id="report-lines"></ul>
      <button type="button" class="btn small" id="report-close">閉じる</button>
    </section>
    <section class="panel" aria-labelledby="add-title">
      <h2 id="add-title">やることを追加</h2>
      <form id="add-form" class="item-form" autocomplete="off">
        <label class="field">
          <span>内容</span>
          <input name="content" type="text" required maxlength="200" placeholder="例：厨房機器の見積もりをとる" enterkeyhint="next">
        </label>
        <div class="more">
          <label class="field">
            <span>必要な対応</span>
            <textarea name="action" rows="2" maxlength="500" placeholder="例：2社に電話して比較する"></textarea>
          </label>
          <label class="field">
            <span>進捗</span>
            <select name="progress">
              <option value="">（選ばない）</option>
              <option>まだ</option>
              <option>途中</option>
              <option>返事待ち</option>
            </select>
          </label>
          <div class="field-row">
            <label class="field">
              <span>誰に任せるか</span>
              <input name="assignee" type="text" maxlength="50" placeholder="例：自分" list="assignees">
            </label>
            <label class="field">
              <span>期限</span>
              <input name="due" type="date">
            </label>
          </div>
        </div>
        <button type="submit" class="btn primary">追加する</button>
      </form>
      <datalist id="assignees"></datalist>

      <details class="paste" id="paste">
        <summary>AIの要約を貼り付けて追加</summary>
        <label class="field">
          <span>AIに整理してもらった文を、ここに貼り付けます</span>
          <textarea id="paste-text" rows="6" placeholder="内容：厨房機器の見積もりをとる&#10;対応：2社に電話して比較する&#10;進捗：返事待ち&#10;担当：店長&#10;期限：2026-11-20"></textarea>
        </label>
        <p class="paste-hint" id="paste-hint" hidden></p>
        <ul class="candidates" id="candidates"></ul>
        <button type="button" class="btn primary" id="paste-add" hidden></button>

        <details class="prompt">
          <summary>AIへのお願い文（最初に1回、AIに伝えておく）</summary>
          <textarea id="prompt-text" rows="11" readonly></textarea>
          <button type="button" class="btn" id="prompt-copy">お願い文をコピー</button>
        </details>
      </details>
    </section>

    <section class="list-area" aria-labelledby="list-title">
      <h2 id="list-title">やること <span class="count" id="open-count"></span></h2>
      <p class="empty" id="empty" hidden>まだ項目がありません。上のフォームから追加してください。</p>
      <ul class="items" id="open-list"></ul>

      <details class="done-block" id="done-block" hidden>
        <summary>完了した項目 <span class="count" id="done-count"></span></summary>
        <ul class="items" id="done-list"></ul>
      </details>
    </section>
    <section class="panel notify" id="notify" hidden aria-labelledby="notify-title">
      <h2 id="notify-title">通知</h2>
      <p id="notify-status" aria-live="polite">確認しています…</p>
      <div class="notify-actions">
        <button type="button" class="btn primary" id="notify-on" hidden>通知を受け取る</button>
        <button type="button" class="btn" id="notify-test" hidden>今すぐ試しに送る</button>
        <button type="button" class="btn small" id="notify-off" hidden>通知をやめる</button>
      </div>
    </section>
    <button type="button" class="btn link notify-open" id="notify-open" hidden aria-controls="notify" aria-expanded="false">通知の設定</button>
    <p class="note" id="local-note" hidden>いまは、この端末の中だけに保存しています（ほかの端末とは同期されません）。</p>
  </main>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" class="btn link" id="toast-undo">元に戻す</button>
  </div>

  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="logic.js"></script>
  <script src="store.js"></script>
  <script src="supabase-store.js"></script>
  <script src="push.js"></script>
  <script src="app.js"></script>
</body>
</html>
